[project]
name = "eventscout"
version = "0.1.0"
description = "Find real-world events in a given city and month, with audience/origin inference and source evidence."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "tenacity>=8.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
eventscout = "eventscout.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
