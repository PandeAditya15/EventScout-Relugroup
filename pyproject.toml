[project]
name = "eventscout"
version = "0.1.0"
description = "Find real-world events in a given city and month, with audience/origin inference and source evidence."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "tenacity>=8.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
